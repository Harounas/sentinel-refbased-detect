name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q minimap2 samtools
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: sentinel-detect --help && sentinel-detect run --help > /dev/null
